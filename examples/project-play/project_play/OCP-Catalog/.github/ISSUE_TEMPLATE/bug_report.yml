name: Bug report
description: Report a problem
title: "[Bug] "

body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and the expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Include any relevant steps, examples, or environment details.
