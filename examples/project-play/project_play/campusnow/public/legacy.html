<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusNow — 校园采购与电子发票 Agent</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#273449;--text:#e2e8f0;--dim:#94a3b8;--accent:#38bdf8;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--mock:#f472b6}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--panel);border-bottom:1px solid #334155}
header h1{font-size:16px}header .sub{color:var(--dim);font-size:12px}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:#7c2d12;color:#fed7aa;border:1px solid #f97316}
.phase{margin-left:auto;display:flex;gap:4px;align-items:center;font-size:11px;color:var(--dim)}
.phase span{padding:3px 8px;border-radius:6px;background:var(--panel2)}
.phase span.on{background:var(--accent);color:#082f49;font-weight:700}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;padding:10px;min-height:0}
.zone{background:var(--panel);border:1px solid #334155;border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.zone h2{font-size:12px;color:var(--dim);padding:8px 12px;border-bottom:1px solid #334155;display:flex;gap:8px;align-items:center;flex-shrink:0}
.zone .body{flex:1;overflow-y:auto;padding:10px 12px;min-height:0}
#need{width:100%;height:54px;background:var(--panel2);border:1px solid #475569;border-radius:8px;color:var(--text);padding:8px;font-size:13px;resize:none}
.row{display:flex;gap:8px;margin-top:8px}
button{background:var(--accent);color:#082f49;border:0;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
button:disabled{background:#475569;color:#94a3b8;cursor:not-allowed}
button.mock{background:var(--mock);color:#4a044e}
button.ghost{background:transparent;border:1px solid #475569;color:var(--dim)}
.card{background:var(--panel2);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:12px}
.card b{font-size:13px}
.card .price{color:var(--ok);font-weight:700}
.card .meta{color:var(--dim);font-size:11px;margin-top:3px}
.tagchip{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;margin-right:4px;background:#334155;color:var(--dim)}
.tagchip.ok{background:#14532d;color:#86efac}.tagchip.bad{background:#7f1d1d;color:#fca5a5}.tagchip.mock{background:#831843;color:#f9a8d4}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:12px;margin:6px 0}
.kv .k{color:var(--dim)}
.trace{font-size:11.5px;font-family:ui-monospace,monospace;line-height:1.7}
.trace .src{display:inline-block;width:52px;font-weight:700}
.trace .ocp{color:var(--accent)}.trace .agent{color:#c084fc}.trace .user{color:var(--ok)}.trace .merchant{color:var(--warn)}.trace .mail{color:#38bdf8}.trace .fs{color:#fb923c}.trace .system{color:var(--dim)}
.trace .at{color:#475569;margin-right:6px}
.fail{background:#450a0a;border:1px solid #b91c1c;border-radius:8px;padding:8px 10px;color:#fca5a5;font-size:12px}
.done{background:#052e16;border:1px solid #22c55e;border-radius:8px;padding:8px 10px;color:#86efac;font-size:12px}
input.txt{width:100%;background:var(--panel2);border:1px solid #475569;border-radius:8px;color:var(--text);padding:6px 8px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>🎓 CampusNow</h1>
  <span class="sub">校园智能采购与电子发票 Agent · OCP 应用赛道</span>
  <span class="badge">测试环境 · 所有订单/支付/发票均为模拟</span>
  <div class="phase" id="phasebar"></div>
</header>
<main>
  <section class="zone">
    <h2>A · 对话与任务输入</h2>
    <div class="body">
      <textarea id="need" placeholder="例:帮我购买一套 200 元以内的实验室电子配件,优先选择支持单位电子发票的商家。下单后我来付款,随后帮我申请浙江大学抬头的电子发票…"></textarea>
      <div class="row">
        <button id="go">发起采购任务</button>
        <button class="ghost" id="reset">重置</button>
      </div>
      <div id="understand" style="margin-top:10px"></div>
    </div>
  </section>
  <section class="zone">
    <h2>B · 商品决策</h2>
    <div class="body" id="plan"><div class="card meta">等待任务…</div></div>
  </section>
  <section class="zone">
    <h2>C · 订单与开票工作区</h2>
    <div class="body" id="order"><div class="card meta">等待方案确认…</div></div>
  </section>
  <section class="zone">
    <h2>D · Agent 执行轨迹与归档</h2>
    <div class="body"><div class="trace" id="trace"></div><div id="archive"></div></div>
  </section>
</main>
<script src="/legacy-app.js"></script>
</body>
</html>
