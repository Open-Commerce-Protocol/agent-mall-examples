<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生活助手 · 咖啡、出行、购物</title><link rel="stylesheet" href="/style.css"></head><body>
<div class="ambient a"></div><div class="ambient b"></div><header><a class="wordmark" href="/" aria-label="生活首页"><span class="brand-symbol">✳</span></a><nav><button class="nav active" onclick="home()">生活首页</button><button class="nav" onclick="openMemory()">我的偏好</button><button class="nav" onclick="showOrders()">我的订单</button></nav><div class="header-actions"><button id="elder" onclick="toggleElder()">长辈模式</button><button id="user" class="avatar" onclick="login()">你</button></div></header>
<main><section class="hero"><h1>今天，<span>想做点什么？</span></h1><p id="greeting">咖啡、出行、好物。让一念帮你少操一点心。</p><div class="composer glass"><textarea id="intent" rows="2" placeholder="帮我找附近的瑞幸，来杯冰拿铁…" aria-label="告诉一念你想做什么"></textarea><div class="composer-bottom"><span id="voiceStatus">说出想要的，或直接打字</span><div><button class="mic" id="mic" onclick="voice()" aria-label="语音输入">♩ 语音输入</button><button class="primary" onclick="submitIntent()">帮我安排 ↗</button></div></div></div><div class="suggestions"><button onclick="quick('帮我点一杯冰拿铁')">☕ 来杯咖啡</button><button onclick="service('飞猪')">✈ 周末去哪里</button><button onclick="service('淘宝')">🎁 挑一份礼物</button></div><div id="currentDraft" class="nearby glass"></div></section>
<section class="section-head"><div><h2>常用服务</h2></div><span class="muted">吃喝 · 出行 · 购物</span></section><div class="category-tabs" id="tabs"></div><section id="brands" class="brands"></section>
<section class="bottom-grid"><article class="glass favorite"><h3>记得你的口味，也尊重你的选择。</h3><p id="prefText">保存喜欢的温度、甜度与预算。下次少说一点，仍由你确认。</p><button onclick="openMemory()">设置我的偏好 →</button></article><article class="glass coffee-feature"><div><h3>给今天加一杯好心情。</h3><p>瑞幸官方服务 · 到店自取</p><button class="primary" onclick="openCoffee()">开始点咖啡 ↗</button></div><div class="cup" aria-hidden="true"><div class="lid"></div><div class="cupbody">luckin<br><b>coffee</b></div><div class="cupshadow"></div></div></article></section>
<footer><span>生活助手 · 让生活轻松一点</span><button onclick="connection()" id="connectionStatus">○ 连接瑞幸</button><button onclick="invite()">邀请朋友 ↗</button></footer></main>
<nav class="mobile-nav" aria-label="主导航"><button onclick="home()"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/></svg><span>首页</span></button><button onclick="document.getElementById('brands').scrollIntoView({behavior:'smooth'})"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>服务</span></button><button onclick="showOrders()"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span>订单</span></button><button onclick="login()"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg><span>我的</span></button></nav><dialog id="modal"><div class="modal-head"><span id="modalLabel">一念</span><button onclick="closeModal()" aria-label="关闭">✕</button></div><div id="modalBody"></div></dialog><div id="toast" role="status"></div><script src="/auth-ui.js"></script><script src="/app.js"></script></body></html>
