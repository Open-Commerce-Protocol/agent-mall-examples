<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记得 · 商家工作台</title><style>*{box-sizing:border-box}body{margin:0;background:#e5e9df;color:#263d30;font:14px 'PingFang SC',sans-serif}button,input{font:inherit}button{cursor:pointer}main{max-width:430px;margin:auto;min-height:100vh;background:#f7f8f1;padding-bottom:40px}header{padding:26px 22px;background:#142e23;color:#eff4e6}header nav{display:flex;justify-content:space-between;align-items:center}a{color:inherit;font-size:11px}h1{font:29px 'Songti SC',serif;margin:28px 0 10px}header p{color:#b0c1ac;line-height:1.8;font-size:12px}.badge{font-size:10px;padding:6px 9px;border:1px solid #70886b;border-radius:20px}.stats{display:flex;gap:8px;margin-top:24px}.stats div{flex:1;background:#ffffff09;border-radius:10px;padding:14px 9px}.stats strong{display:block;font:26px Georgia}.stats small{display:block;font-size:10px;margin-top:7px;color:#afc2ae}section{padding:23px 20px 0}.heading{display:flex;align-items:center;justify-content:space-between}h2{font:22px 'Songti SC',serif;margin:0 0 14px}.muted{font-size:10px;color:#82907b}.live{color:#638350}.live:before{content:'●';margin-right:5px;animation:pulse 1.5s infinite}.filters{display:flex;gap:7px;overflow:auto;padding:4px 0 12px}.filters button{white-space:nowrap;border:1px solid #d5decd;border-radius:20px;background:transparent;color:#5c7055;padding:8px 12px;font-size:11px}.filters button.active{background:#37563d;color:white;border-color:#37563d}input{width:100%;border:1px solid #dce3d2;border-radius:10px;padding:12px;background:#fffef8;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.product{background:#fffef9;border:1px solid #e1e6d7;border-radius:12px;overflow:hidden;text-align:left;padding:0;color:inherit}.art{height:105px;display:grid;place-items:center;font-size:46px;background:radial-gradient(circle,#f7efd9,#e5e9dc)}.info{padding:12px}.info strong{font-size:13px;display:block;margin-bottom:6px}.price{font:21px Georgia;margin:10px 0}.tag{display:inline-block;font-size:9px;background:#eaf0e0;padding:4px 6px;border-radius:4px;margin:3px 3px 0 0}.visits{font-size:10px;color:#859279;margin-top:10px}.feed{background:#fffef9;border:1px solid #e0e6d7;border-radius:12px;padding:4px 13px}.visit{width:100%;border:0;border-bottom:1px solid #edf0e6;background:transparent;text-align:left;padding:15px 0;color:inherit}.visit:last-child{border:0}.visit b{font-size:12px}.visit p{font-size:11px;line-height:1.7;margin:6px 0;color:#6d7e62}.visit small{font-size:10px;color:#89977f}.simulate{border:0;background:#e7eddd;color:#4a6842;border-radius:7px;padding:7px 9px;font-size:10px}.new{animation:appear .6s}.note{font-size:10px;line-height:1.8;color:#849079;margin-top:14px}dialog{border:0;border-radius:16px;background:#fafbf3;color:#2e4533;width:calc(100% - 32px);max-width:390px;padding:24px}dialog::backdrop{background:#10291f99}dialog h3{font:23px 'Songti SC',serif}dialog p{line-height:1.9;font-size:13px;white-space:pre-line}dialog button{width:100%;background:#38563d;color:white;border:0;border-radius:8px;padding:12px}@keyframes pulse{50%{opacity:.25}}@keyframes appear{from{background:#dfeccf;transform:translateY(-8px)}to{background:transparent;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><main><header><nav><span style="font:24px 'Songti SC';letter-spacing:3px">记得 <small style="font:10px sans-serif;letter-spacing:0">商家版</small></span><a href="agent.html?v=voice8">用户侧 ↗</a></nav><h1>商品，被合适的心意找到。</h1><p>把商品放进真实的关系场景。<br>看见 Agent 如何发现、比较与选择。</p><span class="badge">演示店铺 · 集合供给</span><div class="stats"><div><strong id="total-products">8</strong><small>在售商品 · 模拟</small></div><div><strong id="total-visits">126</strong><small>今日 Agent 访问</small></div><div><strong>12</strong><small>购买意向 · 模拟</small></div></div></header><section><div class="heading"><h2>Agent 来访</h2><button class="simulate" id="simulate">＋ 模拟一次访问</button></div><p class="muted live">演示访问记录 · 点击查看需求与访问过程</p><div id="feed" class="feed"></div></section><section><div class="heading"><h2>场景商品库</h2><span class="muted" id="count"></span></div><input id="search" placeholder="搜索商品、用途或心意" aria-label="搜索商品"><div class="filters" id="filters"></div><div class="grid" id="products"></div><p class="note">商品、访问、报价与购买意向均为模拟数据。尚未连接 OCP 或真实 Agent，访问记录不包含真实客户身份。</p></section></main><dialog id="detail"><h3 id="detail-title"></h3><p id="detail-text"></p><button id="close">知道了</button></dialog><script>
const products=[['木质香探索礼盒','🧴',158,'朋友生日','表达了解','香气探索',38],['双人餐具礼盒','🍽️',260,'婚礼祝福','一起生活','日常用餐',26],['桌面园艺套装','🌱',168,'关心父母','实用关心','阳台园艺',21],['茶与感谢卡','🍵',148,'感谢客户','克制体面','办公室分享',18],['猫咪日常补给','🐈',189,'宠物关怀','贴心实用','猫粮猫砂',16],['展览双人体验','🎟️',240,'朋友生日','一起快乐','周末约会',32],['花瓶与手写卡','🏺',188,'婚礼祝福','温柔祝福','新家装饰',24],['冬日宠物外套','🐕',99,'宠物关怀','记得小事','冬日保暖',11]];
let scene='全部',visits=126;let events=[{agent:'Gift Agent · A017',action:'查询报价',product:0,need:'朋友生日，预算 200 元，喜欢木质香、不喜欢甜香',time:'刚刚',steps:'搜索生日场景 → 匹配木质香标签 → 查看商品 → 查询含包装报价'},{agent:'Personal Agent · A042',action:'购买意向',product:1,need:'朋友结婚，预算 300 元，希望日常用得上',time:'2 分钟前',steps:'搜索婚礼祝福 → 比较餐具与花瓶 → 选择餐具 → 发起购买意向（未下单）'},{agent:'Relationship Agent · A008',action:'浏览商品',product:3,need:'项目结束向客户表达感谢，预算 150 元，收礼规则待确认',time:'5 分钟前',steps:'搜索感谢客户 → 查看组合内容 → 核对价格 → 待用户确认收礼规则'}];
const $=id=>document.getElementById(id);function node(tag,text,cls=''){let n=document.createElement(tag);n.textContent=text;n.className=cls;return n}function detail(title,text){$('detail-title').textContent=title;$('detail-text').textContent=text;$('detail').showModal()}$('close').onclick=()=>$('detail').close();
function render(){let list=products.filter(p=>(scene==='全部'||p[3]===scene)&&p.join(' ').includes($('search').value.trim()));$('count').textContent=list.length+' 件商品';$('products').replaceChildren(...list.map(p=>{let b=node('button','','product');b.append(node('div',p[1],'art'));let info=node('div','','info');info.append(node('strong',p[0]),node('div','¥'+p[2],'price'));p.slice(3,6).forEach(t=>info.append(node('span',t,'tag')));info.append(node('div','Agent 查看 '+p[6]+' 次 · 模拟','visits'));b.append(info);b.onclick=()=>detail(p[0],'场景：'+p[3]+'\n想表达：'+p[4]+'\n用途：'+p[5]+'\n示例价格：¥'+p[2]+'\n\nAgent 可通过场景、预算与用途找到这个商品。当前为演示商品。');return b}));$('filters').replaceChildren(...['全部',...new Set(products.map(p=>p[3]))].map(t=>{let b=node('button',t,t===scene?'active':'');b.onclick=()=>{scene=t;render()};return b}))}
function renderFeed(){ $('feed').replaceChildren(...events.slice(0,4).map((e,i)=>{let b=node('button','','visit'+(i===0?' new':''));b.append(node('b',e.agent+' · '+e.action),node('p',products[e.product][0]+' · '+e.need),node('small',e.time+' ↗'));b.onclick=()=>detail(e.agent,e.need+'\n\n访问路径\n'+e.steps+'\n\n当前动作：'+e.action+'\n来源：模拟访问，不是真实流量。');return b}))}
$('search').oninput=render;$('simulate').onclick=()=>{let base=events[events.length-1];events.unshift({...base,agent:'Gift Agent · A'+String(visits+1).padStart(3,'0'),time:'刚刚'});visits++;$('total-visits').textContent=visits;renderFeed()};render();renderFeed();
</script></html>
