<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记得 · 送一份懂你的礼物</title>
<style>
:root{--paper:#f6f3eb;--ink:#253d32;--muted:#73796d;--line:#d9dfd1;--accent:#da653d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{height:82px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 6vw}.logo{font-family:"Songti SC",serif;font-size:29px;letter-spacing:4px}.badge{font-size:12px;border:1px solid var(--line);border-radius:30px;padding:8px 14px;color:var(--muted)}main{max-width:1280px;margin:auto;padding:48px 6vw}small,.eyebrow{color:var(--muted);font-size:12px;letter-spacing:2px}h1{font-family:"Songti SC",serif;font-weight:500;font-size:clamp(35px,5vw,58px);margin:14px 0 16px;line-height:1.3}h1 em{color:var(--accent);font-style:normal}.intro{color:var(--muted);line-height:1.9}.layout{display:grid;grid-template-columns:280px 1fr;gap:38px;margin-top:40px}.people{display:grid;gap:10px}.person{border:1px solid var(--line);background:transparent;border-radius:12px;padding:16px;text-align:left;color:var(--ink);display:flex;gap:13px;align-items:center}.person.active{background:var(--ink);color:white;border-color:var(--ink)}.avatar{width:42px;height:42px;border-radius:50%;background:#e9e1cf;display:grid;place-items:center;font-size:23px}.person strong{display:block;font-size:15px}.person span.sub{display:block;font-size:12px;opacity:.7;margin-top:5px}.memory{margin-top:22px;border-top:1px solid var(--line);padding-top:20px;font-size:13px;line-height:1.8}.memory ul{padding-left:18px}.memory label{display:block;margin-top:12px}.memory input{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px;background:#fffdf8}.tiny{font-size:11px;color:var(--muted);line-height:1.7}.controls{display:flex;align-items:end;gap:18px;flex-wrap:wrap;background:#edeedf;padding:20px;border-radius:12px}label{font-size:12px}label strong{display:block;font-size:14px;margin-bottom:9px}input[type=number],select{padding:10px;border:1px solid #c9d0be;background:#fffdf8;border-radius:6px;color:var(--ink)}input[type=number]{width:110px}.primary{border:0;border-radius:6px;background:var(--ink);color:white;padding:12px 18px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:28px 0 18px}.sectionhead h2{font-size:20px;font-weight:500;margin:0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fffdf7;animation:reveal .4s ease both}.art{height:145px;display:flex;align-items:center;justify-content:center;background:#e8ecd9;position:relative;font-size:67px}.card:nth-child(2) .art{background:#f0e0d2}.card:nth-child(3) .art{background:#dce7e4}.type{position:absolute;left:15px;top:14px;font-size:11px;border-radius:20px;padding:5px 9px;background:#fffaf0;font-family:"PingFang SC",sans-serif}.content{padding:20px}.content h3{font-family:"Songti SC",serif;font-size:23px;font-weight:500;margin:0 0 10px}.reason{font-size:13px;line-height:1.8;min-height:70px}.note{font-size:12px;line-height:1.7;color:var(--muted)}.bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:17px;padding-top:15px}.price{font-size:22px}.choose{border:1px solid var(--ink);border-radius:6px;background:transparent;color:var(--ink);padding:8px 13px}.empty{padding:30px;border:1px dashed var(--line);border-radius:10px;line-height:1.8}dialog{border:1px solid var(--line);border-radius:16px;max-width:520px;width:90%;padding:30px;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#13291e70}dialog p{line-height:1.9}footer{margin-top:40px;font-size:11px;color:var(--muted);line-height:1.8;border-top:1px solid var(--line);padding-top:18px}@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:760px){main{padding-top:30px}.layout{grid-template-columns:1fr;gap:24px}.people{grid-template-columns:1fr 1fr}.memory{margin-top:15px}.cards{grid-template-columns:1fr}header{height:70px}.badge{font-size:10px}.intro{font-size:14px}}
</style>
<header><div class="logo">记得<span style="font-size:11px;letter-spacing:1px;margin-left:15px">WITH YOU IN MIND</span></div><span class="badge">本地体验 · 人物与商品均为模拟</span></header>
<main><div class="eyebrow">为重要的人，留一点心思</div><h1>礼物不难买。<br>难的是，<em>刚好懂他。</em></h1><p class="intro">从你记得的小事出发，挑一份有理由的礼物。<br>选择一个模拟人物，看看不同关系如何改变推荐。</p>
<div class="layout"><aside><div class="people" id="people"></div><div class="memory" id="memory"></div></aside><section><div class="controls"><label><strong>整份礼物预算</strong><input type="number" id="budget" min="1" max="10000" value="300" aria-label="礼物预算"> 元</label><label><strong>希望对方感受到</strong><select id="feeling"><option>被认真惦记</option><option>轻松与快乐</option><option>实用的关心</option></select></label><button class="primary" id="refresh">看看合适的礼物 ↗</button></div><div class="sectionhead"><h2 id="heading"></h2><small id="count"></small></div><div class="cards" id="cards"></div><footer>所有价格、渠道与到货时间为演示数据，不代表实时商品报价。尚未接入商品 MCP，不会创建订单。<br>关系备注仅保存在当前页面，刷新后恢复模拟数据；请勿录入真实敏感信息。</footer></section></div></main>
<dialog id="dialog"><small>你的送礼方案</small><h2 id="chosen"></h2><p id="summary"></p><div id="comparison"></div><p class="tiny">这是模拟确认页，渠道价格为示例。真实版本需核对同款规格、运费与送达时间，确认后才能下单。</p><button class="primary" id="close">保留想法，继续挑选</button></dialog>
<script>
const persons=[
{name:'妈妈',sub:'生日 · 还有 21 天',icon:'🌿',facts:['喜欢园艺，常照顾阳台上的植物','不喜欢需要学习的复杂设备','去年送过围巾'],uncertain:'尚不知道她已有的园艺工具',items:[['阳台园艺小套装','🌱',168,'组合礼物','园艺手套、轻巧花剪与一张手写卡','她明确喜欢园艺，把关心放在她自己的兴趣里。','购买前需确认是否已有同款工具。'],['植物主题手账','📖',68,'单件礼物','记录植物生长的纸质手账','呼应她照顾植物的日常，使用简单。','需要确认她是否喜欢纸笔记录。'],['园艺小套装＋植物手账','🌿',236,'组合礼物','工具与记录搭配，附手写生日卡','围绕她的园艺兴趣，组合成一个完整主题。','先核对已有工具与记录习惯。']]},
{name:'小林',sub:'大学好友 · 生日还有 14 天',icon:'🪵',facts:['明确说过喜欢木质香，不喜欢甜香','喜欢周末逛展','去年送过一本书'],uncertain:'还不知道她正在使用的香水',items:[['木质香探索小样组','🧴',158,'组合礼物','三支不同木质调小样与香气记录卡','用已确认的木质香偏好筛选，也给她试香的空间。','木质调也有差异，不能保证每支都喜欢。'],['双人展览体验礼','🎟️',240,'体验礼物','双人展览邀约与手写卡','她喜欢逛展，礼物也是一次一起相处的邀请。','需双方确认日期；票务信息为模拟。'],['香气小样＋观展笔记本','🪵',218,'组合礼物','木质香小样与简洁笔记本','把香气偏好和逛展习惯放进同一份礼物。','确认是否需要笔记本，避免无用搭配。']]},
{name:'阿泽与小雨',sub:'朋友 · 婚礼还有 28 天',icon:'🏡',facts:['两个人都喜欢做饭','新家储物空间比较小','没有确认过家电需求'],uncertain:'需要了解他们已有的餐具',items:[['两人份陶瓷餐具','🍽️',260,'组合礼物','两只饭碗与两只小盘','围绕两人共同做饭的生活，份量适中。','需核对已有餐具及审美偏好。'],['共同食谱记录册','📒',88,'单件礼物','一本可以共同记录的食谱册','把祝福放在一起创造日常回忆上，不占太多空间。','需要确认是否愿意手写记录。'],['餐桌小花瓶＋食谱册','🏺',188,'组合礼物','小尺寸花瓶与共同食谱册','以共同生活为主题，控制体积。','花瓶风格尚未确认；不保证审美匹配。']]},
{name:'陈女士',sub:'合作客户 · 项目刚结束',icon:'🍵',facts:['明确说过喜欢茶','这次想感谢合作','尚未确认对方公司的收礼规则'],uncertain:'先确认允许收礼及金额限制',items:[['手写感谢卡','✉️',20,'单件礼物','具体写下合作中值得感谢的事情','表达感谢，避免把关系维护等同于高价礼物。','仍应确认对方是否方便接收。'],['小份茶叶品鉴礼','🍵',128,'单件礼物','小规格茶叶礼盒','结合茶的偏好，保持适度。','先确认收礼规则及具体茶类偏好。'],['茶叶品鉴礼＋感谢卡','🎁',148,'组合礼物','小份茶叶与具体的感谢文字','商品回应偏好，卡片表达感谢的原因。','收礼规则未确认，暂不建议进入购买。']]}
];let active=1;
const $=id=>document.getElementById(id);const extra={};
function renderPeople(){ $('people').replaceChildren(...persons.map((p,i)=>{let b=document.createElement('button');b.className='person'+(i===active?' active':'');b.innerHTML=`<span class="avatar">${p.icon}</span><span><strong>${p.name}</strong><span class="sub">${p.sub}</span></span>`;b.onclick=()=>{active=i;renderPeople();renderMemory();recommend()};return b}))}
function renderMemory(){const p=persons[active];$('memory').innerHTML=`<small>已确认的模拟事实</small><ul>${p.facts.map(f=>`<li>${f}</li>`).join('')}</ul><p class="tiny">待确认：${p.uncertain}</p><label>补充一条事实（演示）<input id="fact" placeholder="例如：已经买过香水小样"></label><button class="choose" id="save" style="margin-top:9px">确认这条记忆</button><p id="saved" class="tiny"></p>`;$('fact').value=extra[active]||'';$('save').onclick=()=>{extra[active]=$('fact').value.trim();$('saved').textContent=extra[active]?'已确认。演示将展示这条备注；不会自动推断商品偏好。':'请输入一条事实。';recommend()}}
function recommend(){const p=persons[active],budget=Number($('budget').value),feeling=$('feeling').value;$('heading').textContent=`给${p.name}的一点心意`;$('cards').replaceChildren();if(!Number.isFinite(budget)||budget<1){$('count').textContent='';$('cards').innerHTML='<div class="empty">请输入大于 0 的预算。</div>';return}let items=p.items.filter(x=>x[2]<=budget);if(feeling==='实用的关心')items.sort((a,b)=>a[3]==='体验礼物'?1:b[3]==='体验礼物'?-1:b[2]-a[2]);else if(feeling==='轻松与快乐')items.sort((a,b)=>(b[3]==='体验礼物')-(a[3]==='体验礼物')||(b[3]==='组合礼物')-(a[3]==='组合礼物'));else items.sort((a,b)=>(b[3]==='组合礼物')-(a[3]==='组合礼物'));$('count').textContent=`${items.length} 份方案 · 含模拟包装及运费`;if(!items.length){$('cards').innerHTML='<div class="empty">当前演示商品库没有预算内的方案。可以调整预算；不会用超预算商品填补结果。</div>';return}for(const x of items){let card=document.createElement('article');card.className='card';card.innerHTML=`<div class="art"><span class="type">${x[3]}</span>${x[1]}</div><div class="content"><h3>${x[0]}</h3><div class="note">${x[4]}</div><p class="reason">${x[5]}<br>表达方向：${feeling}。</p><div class="note">待确认 · ${x[6]}</div><p class="note extra"></p><div class="bottom"><span class="price">¥${x[2]} <small>示例总价</small></span><button class="choose">选择这份礼物 ↗</button></div></div>`;if(extra[active])card.querySelector('.extra').textContent='你的补充：'+extra[active]+'（请据此复核候选）';card.querySelector('button').onclick=()=>choose(x,p);$('cards').append(card)}}
function choose(x,p){$('chosen').textContent=x[0];$('summary').textContent=`送给${p.name} · ${$('feeling').value}。内容：${x[4]}。示例总价 ¥${x[2]}，在 ¥${$('budget').value} 的预算内。`;$('comparison').innerHTML=`<div class="memory"><strong>同款方案价格对照 · 模拟</strong><p>渠道 A：商品 ¥${x[2]-20} ＋包装运费 ¥20 ＝ ¥${x[2]}<br>渠道 B：商品 ¥${x[2]-10} ＋包装运费 ¥25 ＝ ¥${x[2]+15}</p><p class="note">${x[6]}<br>预计送达：3–5 天（模拟，未核实库存）。</p></div>`;$('dialog').showModal()}
$('close').onclick=()=>$('dialog').close();$('refresh').onclick=recommend;$('budget').onchange=recommend;$('feeling').onchange=recommend;renderPeople();renderMemory();recommend();
</script></html>
